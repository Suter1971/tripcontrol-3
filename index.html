<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="description" content="TripControl 3.0 – organizácia a kontrola výletov">
  <title>TripControl 3.0 · TEST 0.1</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #263347; background:#f6f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 520px; background: #fff; border: 1px solid #e7ebf1; border-radius: 20px; padding: clamp(26px, 6vw, 48px); box-shadow: 0 14px 36px rgba(31, 49, 71, .055); }
    .eyebrow { color: #738197; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(30px, 6vw, 40px); letter-spacing: -.035em; margin: 14px 0 12px; line-height: 1.12; }
    p { line-height: 1.65; color:#5b687d; margin: 0; }
    .line { height: 1px; background:#edf0f4; margin: 28px 0; }
    .row { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .dot { background:#dff5e9; color:#147748; display: inline-grid; place-items: center; width: 32px; height:32px; border-radius: 50%; font-weight: 750; flex:0 0 32px; }
    .small { font-size: 12px; color:#8490a0; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Technický test · verzia 0.1</div>
    <h1>TripControl 3.0</h1>
    <p>Nová aplikácia na prípravu, evidenciu a kontrolu výletov.</p>
    <div class="line"></div>
    <div class="row"><span class="dot">✓</span><span>Úvodná stránka sa úspešne načítala.</span></div>
    <div class="small">Prvý test publikovania cez GitHub Pages. Zatiaľ bez databázy a PWA funkcií.</div>
  </main>
</body>
</html>
