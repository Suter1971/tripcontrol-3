*{box-sizing:border-box}html,body{padding:0;margin:0;height:100%}body{background:var(--bg)}button{font:inherit}button:focus-visible{outline:3px solid #27b8df;outline-offset:2px}svg{display:block}h1,h2,h3,p{margin-top:0}.app{display:grid;grid-template-columns:244px minmax(0,1fr) 331px;min-height:100dvh;height:100dvh;overflow:hidden}
.global{position:relative;background:#04172f;color:#fff;min-height:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.global:before{content:'';position:absolute;inset:0;z-index:-2;background-image:linear-gradient(180deg,rgba(2,13,30,.25),rgba(2,13,30,.1) 38%,rgba(2,13,30,.45) 90%),var(--left-photo);background-position:center,center;background-size:cover;}
.global:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,11,30,.28),transparent 85%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;min-height:89px;padding:17px 16px;border-bottom:1px solid rgba(255,255,255,.13)}
.brand-logo{flex:none;width:47px;height:44px;display:grid;place-items:center}.brand-logo svg{width:47px;height:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}.brand-name{font-size:18px;font-weight:500;letter-spacing:-.35px;line-height:1.2;white-space:nowrap}.brand-sub{font-size:10px;letter-spacing:1.3px;opacity:.8;margin-top:4px;text-transform:uppercase;white-space:nowrap}
.global-inner{padding:26px 12px 24px;overflow:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.32) transparent}
.group-caption{color:#c1d4eb;font-size:11px;font-weight:500;letter-spacing:1.35px;text-transform:uppercase;margin:0 10px 12px}
.global-menu{display:grid;gap:5px}.global-btn{width:100%;height:47px;display:flex;align-items:center;gap:13px;border:1px solid transparent;border-radius:12px;background:transparent;color:#fff;text-align:left;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500;transition:background .18s,border .18s}
.global-btn:hover{background:rgba(255,255,255,.12)}.global-btn.active{background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.26);box-shadow:inset 3px 0 #81d5d5}.global-btn img{width:25px;height:25px;object-fit:contain;filter:brightness(0) invert(1);flex:none}
.global-footer{padding:11px 17px 17px;font-size:11px;opacity:.84}
.work{min-width:0;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#d0ddeb transparent}
.toolbar{min-height:77px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 37px;gap:7px;font-size:13px;color:#6b7e98;position:sticky;top:0;z-index:4}
.toolbar strong{font-weight:500;color:var(--navy)}.toolbar .separator{color:#aab6c8}
.page{max-width:1140px;margin:auto;padding:39px 38px 70px}.eyebrow{font-size:11px;letter-spacing:1.45px;color:#356695;text-transform:uppercase;font-weight:500;margin-bottom:9px}
.page h1{font-size:30px;font-weight:500;line-height:1.28;letter-spacing:-.7px;margin:0 0 7px;color:#09274a}.subtitle{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:27px}
.section-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:29px 0 13px}.section-head h2{font-size:16px;margin:0;font-weight:500;color:#12345a}.section-head .hint{color:var(--muted);font-size:12px}
.paper{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 6px 22px rgba(14,41,76,.035)}
.trip-item{display:flex;align-items:center;padding:20px;gap:19px}.trip-thumb{width:149px;height:105px;border-radius:12px;background-image:linear-gradient(180deg,rgba(2,19,40,0),rgba(2,19,40,.32)),var(--trip-thumb);background-size:cover;background-position:50% 48%;flex-shrink:0}
.trip-data{min-width:0;flex:1}.trip-name{font-size:18px;font-weight:500;line-height:1.3;margin-bottom:6px}.trip-meta{font-size:13px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{background:#edf3f9;color:#344e69;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:500}.chip.blue{background:#ddf0fd;color:#075b99}.chip.green{background:#e1f6ef;color:#08694d}
.primary-action{border:none;border-radius:11px;background:#0c3769;color:#fff;padding:12px 17px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;box-shadow:0 5px 12px rgba(10,45,86,.1)}.primary-action:hover{background:#15518e}.secondary-action{background:#f0f6fb;color:#0b3f72;border:1px solid #d5e4f0;box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:24px}.stat{padding:21px 21px 18px;min-width:0}.stat .small{color:var(--muted);font-size:12px}.stat .number{font-weight:500;font-size:25px;line-height:1.45;color:#0b315e}.stat .desc{font-size:12px;color:#6d8096;line-height:1.5}
.data-card{padding:22px;margin:0 0 14px}.data-card h2{font-size:16px;font-weight:500;margin:0 0 16px;color:var(--navy)}.two-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.muted{color:var(--muted)}.keyvals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.keyvals .field label{color:#71849a;font-size:12px;display:block;margin-bottom:5px}.keyvals .field div{font-weight:500;font-size:14px}.timeline{display:grid;gap:0}.timeline-row{display:grid;grid-template-columns:87px 1fr;gap:18px;padding:15px 0;border-bottom:1px solid var(--line);align-items:start}.timeline-row:last-child{border:0;padding-bottom:0}.date-chip{background:#eaf3fa;border-radius:10px;text-align:center;color:#164c79;padding:9px 4px;font-size:12px;font-weight:500}.timeline-row h3{font-size:14px;font-weight:500;margin:0 0 5px}.timeline-row p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid #e7edf4}table{border-collapse:collapse;width:100%;text-align:left}th{background:#f0f5fa;font-size:12px;font-weight:500;color:#49617e;padding:13px 15px;white-space:nowrap}td{padding:13px 15px;font-size:13px;border-top:1px solid #e7edf4;color:#243e5b}td strong{font-weight:500}td:last-child.num,th:last-child.num{text-align:right}tr:last-child td{border-bottom:0}.total-row td{background:#f2f7fc;font-weight:500;color:#123456}
.info-note{color:#657c96;font-size:13px;line-height:1.7;margin:13px 0 0}.person-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.person-row:last-child{border:0}.avatar{display:grid;place-items:center;width:41px;height:41px;background:#e5f0fb;border-radius:14px;color:#124a7e;font-weight:500;font-size:13px}.person-row .person-name{font-weight:500;font-size:14px}.person-row .person-small{font-size:12px;color:var(--muted)}

  async function updateECB(manual=false){
    const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Bratislava',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    if(!manual&&db.fx.lastAttempt===today)return;
    db.fx.lastAttempt=today;persist();
    try{
      const res=await fetch('https://api.frankfurter.dev/v2/providers/ecb/rates',{mode:'cors',cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();if(!Array.isArray(json))throw Error('Neplatný formát');
      const candidates=json.filter(r=>String(r.base).toUpperCase()==='EUR'&&currencyCodes.includes(String(r.quote).toUpperCase())&&Number(r.rate)>0);
      if(!candidates.length)throw Error('Chýbajú referenčné kurzy EUR');
      const dates=[...new Set(candidates.map(r=>r.date))].sort();const latest=dates[dates.length-1];
      const map={EUR:1};for(const r of candidates.filter(r=>r.date===latest))map[String(r.quote).toUpperCase()]=Number(r.rate);
      // Niektoré meny nemusia byť zverejnené v každom dni; zachováme poslednú uloženú hodnotu.
      db.fx.rates={...db.fx.rates,...map};db.fx.rateDate=latest;ui.fxMessage='Aktuálne uložené';persist();if(selected==='Kurzy')navigate(selected,false);if(manual)toast('Kurzový lístok ECB bol aktualizovaný.');
    }catch(e){ui.fxMessage='Offline alebo zdroj nedostupný';if(selected==='Kurzy')navigate(selected,false);if(manual)toast('Kurzový lístok nie je dostupný; zostávajú uložené kurzy.');}
  }
  function exportJSON(){db.settings.lastBackup=new Date().toLocaleString('sk-SK');persist();const url=URL.createObjectURL(new Blob([JSON.stringify({format:'TripControl 3.0 preview v0.4',data:db},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='TripControl3-v0.4-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);navigate('Nastavenia',false);}
  function handleForm(form){const data=Object.fromEntries(new FormData(form).entries());switch(form.dataset.form){
    case 'newTrip':{if(!data.name.trim()||!data.start||!data.end){toast('Vyplň názov a termín výletu.');return;}if(data.end<data.start){toast('Koniec nemôže byť pred začiatkom.');return;}const t={id:uid(),name:data.name.trim(),start:data.start,end:data.end,status:'Nápad',peopleCount:0,km:null,budget:null,currency:data.currency,financing:data.financing,place:'',demo:false};db.trips.push(t);ui.selectedTripId=t.id;break;}
    case 'copyTrip':{const t=db.trips.find(v=>v.id===data.source);if(!t||!data.name.trim()){toast('Vyber výlet a zadaj názov.');return;}const copy={...t,id:uid(),name:data.name.trim(),demo:false};db.trips.push(copy);ui.selectedTripId=copy.id;break;}
    case 'newPerson':case 'editPerson':{if(!data.display.trim()){toast('Vyplň zobrazované meno.');return;}let p=db.people.find(v=>v.id===data.id);if(!p){p={id:uid(),tripIds:[]};db.people.push(p);}Object.assign(p,{first:data.first.trim(),last:data.last.trim(),display:data.display.trim(),city:data.city.trim(),birth:data.birth,note:data.note.trim()});ui.expandedPerson=p.id;break;}
    case 'addCurrency':{if(!currencyCodes.includes(data.code)){toast('Neplatná mena.');return;}if(!db.fx.currencies.includes(data.code))db.fx.currencies.push(data.code);ui.fxTo=data.code;break;}
    case 'dictionary':{const list=db.dictionaries[data.list];if(!list){toast('Číselník neexistuje.');return;}const label=String(data.label||'').trim();if(!label){toast('Zadaj názov položky.');return;}if(data.mode==='edit'){const i=list.indexOf(data.original);if(i<0)return;if(list.some((v,j)=>j!==i&&v.toLowerCase()===label.toLowerCase())){toast('Taká položka už existuje.');return;}list[i]=label;}else if(data.mode==='add'){if(list.some(v=>v.toLowerCase()===label.toLowerCase())){toast('Taká položka už existuje.');return;}list.push(label);}ui.dictionaryMode='';break;}
  }persist();document.getElementById('tc-dialog')?.remove();navigate(selected,false);}

    }
  }
  function people(){return ['Janko','Ferko','Anička','Marienka'].map((p,i)=>`<div class="person-row"><div class="avatar">${p.substring(0,1).toUpperCase()}</div><div><div class="person-name">${p}</div><div class="person-small">Nórsko TEST 2027</div></div></div>`).join('')}
  function navigate(view,scroll=true){
    selected=view;$('breadcrumb').textContent=view;
    $('actionBar').innerHTML=actions(view);
    $('pageContent').innerHTML=content(view);
    renderActive();renderRightTrip();
    if(scroll)$('workMain').scrollTop=0;
  }
  document.addEventListener('click',e=>{
    const nav=e.target.closest('button[data-view]');if(nav){navigate(nav.dataset.view);return;}
    const trip=e.target.closest('[data-trip]');if(trip){ui.selectedTripId=trip.dataset.trip;navigate('Prehľad');return;}
    const p=e.target.closest('[data-person]');if(p){ui.expandedPerson=ui.expandedPerson===p.dataset.person?'':p.dataset.person;navigate('Účastníci',false);return;}
    const action=e.target.closest('[data-action]');if(!action)return;
    switch(action.dataset.action){
      case 'newTrip':formNewTrip();break;
      case 'copyTrip':formCopyTrip();break;
      case 'newPerson':formPerson();break;
      case 'editPerson':formPerson(db.people.find(p=>p.id===action.dataset.id));break;
      case 'addCurrency':addCurrencyForm();break;
      case 'refreshRates':updateECB(true);break;
      case 'closeModal':document.getElementById('tc-dialog')?.remove();break;
      case 'toggleDictionary':ui.expandedDictionary=ui.expandedDictionary===action.dataset.id?'':action.dataset.id;ui.editDictionary='';ui.dictionaryMode='';navigate('Číselníky',false);break;
      case 'editDictionary':ui.editDictionary=ui.expandedDictionary||Object.keys(db.dictionaries)[0];ui.expandedDictionary=ui.editDictionary;ui.dictionaryMode='';navigate('Číselníky',false);break;
      case 'modeDictionary':ui.dictionaryMode=action.dataset.mode;navigate('Číselníky',false);break;
      case 'exportJSON':exportJSON();break;
      case 'importJSON':document.getElementById('fileImport')?.click();break;
    }
  });
  document.addEventListener('change',async e=>{
    const field=e.target;
    if(field.dataset.control){switch(field.dataset.control){
      case 'tripStatus':ui.tripStatus=field.value;break;
      case 'tripSort':ui.tripSort=field.value;break;
      case 'peopleTrip':ui.peopleTrip=field.value;break;
      case 'peopleSort':ui.peopleSort=field.value;break;
      case 'dictionary':ui.expandedDictionary=field.value;ui.editDictionary='';ui.dictionaryMode='';break;
      case 'fxFrom':ui.fxFrom=field.value;break;
      case 'fxTo':ui.fxTo=field.value;break;
    }navigate(selected,false);return;}
    if(field.dataset.setting){db.settings[field.dataset.setting]=field.value;persist();navigate('Nastavenia',false);return;}
    if(field.name==='original'&&field.closest('.dict-form'))field.closest('.dict-form').querySelector('input[name="label"]').value=field.value;
    if(field.id==='fileImport'&&field.files?.[0]){try{const txt=await field.files[0].text();const payload=JSON.parse(txt);const parsed=payload?.data||payload;if(!Array.isArray(parsed.trips)||!Array.isArray(parsed.people)||!parsed.fx||!parsed.settings||!parsed.dictionaries)throw Error('Neplatná záloha');if(!confirm('Import nahradí doterajšie lokálne údaje. Pokračovať?'))return;db=parsed;persist();ui.selectedTripId=db.trips[0]?.id||'';ui.expandedDictionary=Object.keys(db.dictionaries)[0]||'';navigate('Nastavenia');toast('Údaje boli importované.');}catch(err){toast('Import zlyhal: neplatný súbor JSON.');}}
  });
  document.addEventListener('input',e=>{if(e.target.dataset.control==='fxAmount'){ui.fxAmount=e.target.value;const a=Number(String(ui.fxAmount).replace(',','.')),from=rateFor(ui.fxFrom),to=rateFor(ui.fxTo);const el=$('fxResult');if(el)el.textContent=Number.isFinite(a)&&Number.isFinite(from)&&Number.isFinite(to)?skNumber(a/from*to,4):'—';}});
  document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();handleForm(form);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('tc-dialog')?.remove();});
  renderRightTrip();navigate('Výlety');updateECB(false);
})();
;</script></body></html>
